name: Compile Browser Build
on: [workflow_dispatch]

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Emscripten SDK
        run: |
          git clone --depth 1 https://github.com ../emsdk
          python3 ../emsdk/emsdk.py install 6.0.10
          python3 ../emsdk/emsdk.py activate 6.0.10

      - name: Compile Game for Browser
        run: |
          # Source the variables and run the build graph in ONE single session
          source ../emsdk/emsdk_env.sh
          python3 configure.py --release
          ninja web

      - name: Package Web Files For Download
        uses: actions/upload-artifact@v4
        with:
          name: halo-browser-playable-files
          path: build/web/site/
